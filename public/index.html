<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rags2riches</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1a1a1a;
        --muted: #5a5a5a;
        --bg: #fafaf8;
        --card: #fff;
        --line: #ddd;
        --accent: #2a5db0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #ececec;
          --muted: #a8a8a8;
          --bg: #141414;
          --card: #1e1e1e;
          --line: #333;
          --accent: #7fa6e8;
        }
      }
      body {
        margin: 0;
        padding: 24px 16px;
        font:
          16px/1.5 system-ui,
          sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      main {
        max-width: 760px;
        margin: 0 auto;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      p.sub {
        color: var(--muted);
        margin: 0 0 20px;
      }
      form {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      input[type='text'] {
        flex: 1 1 320px;
        padding: 10px 12px;
        font: inherit;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        color: inherit;
      }
      select,
      button {
        padding: 10px 12px;
        font: inherit;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        color: inherit;
      }
      button {
        background: var(--accent);
        color: #fff;
        border-color: transparent;
        cursor: pointer;
      }
      details {
        margin-top: 8px;
        color: var(--muted);
      }
      #answer {
        white-space: pre-wrap;
        margin: 24px 0 16px;
        padding: 16px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        min-height: 1em;
      }
      ol {
        padding-left: 20px;
      }
      li {
        margin-bottom: 10px;
      }
      li small {
        color: var(--muted);
        display: block;
      }
      li blockquote {
        margin: 4px 0 0;
        padding-left: 10px;
        border-left: 2px solid var(--line);
        color: var(--muted);
        font-size: 14px;
        max-height: 6em;
        overflow: hidden;
      }
      #meta {
        color: var(--muted);
        font-size: 13px;
      }
      .err {
        color: #c0392b;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>rags2riches</h1>
      <p class="sub">Fragen an deutsche Gesetze und Dokumente, mit Seitenzitaten.</p>
      <form id="f">
        <input
          id="q"
          type="text"
          placeholder="Wie hoch ist der ermäßigte Umsatzsteuersatz?"
          required
          autofocus
        />
        <select id="mode">
          <option value="hybrid">hybrid</option>
          <option value="dense">dense</option>
          <option value="fts">full-text</option>
        </select>
        <button type="submit">Fragen</button>
        <details>
          <summary>Mandant / Berechtigungen</summary>
          <label>Tenant <input id="tenant" type="text" value="public" /></label>
          <label>
            Als (user:…, group:…)
            <input id="as" type="text" placeholder="user:leon,group:kitchen" />
          </label>
        </details>
      </form>
      <div id="answer" aria-live="polite"></div>
      <ol id="cites"></ol>
      <div id="meta"></div>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      $('f').addEventListener('submit', async (e) => {
        e.preventDefault();
        $('answer').textContent = '…';
        $('answer').className = '';
        $('cites').innerHTML = '';
        $('meta').textContent = '';
        const body = {
          question: $('q').value,
          mode: $('mode').value,
          tenant: $('tenant').value || 'public',
          principals: $('as').value ? $('as').value.split(',') : [],
        };
        try {
          const r = await fetch('/ask', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(body),
          });
          const d = await r.json();
          if (!r.ok) throw new Error(d.error || r.statusText);
          $('answer').textContent = d.answer;
          for (const c of d.citations) {
            const li = document.createElement('li');
            const where = [c.source, c.page && `S. ${c.page}`, c.section]
              .filter(Boolean)
              .join(' · ');
            li.innerHTML = `<strong>[${c.n}]</strong> ${where}<small>sichtbar für: ${c.acl.join(', ')}</small><blockquote></blockquote>`;
            li.querySelector('blockquote').textContent = c.content;
            $('cites').appendChild(li);
          }
          $('meta').textContent =
            `retrieval ${d.retrieveMs} ms · generation ${d.answerMs} ms · tokens ${d.usage.inputTokens}/${d.usage.outputTokens}`;
        } catch (err) {
          $('answer').textContent = err.message;
          $('answer').className = 'err';
        }
      });
    </script>
  </body>
</html>
